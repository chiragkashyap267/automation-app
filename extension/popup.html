<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fill this application</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #11161d;
        --muted: #5b6673;
        --line: #e3e7ec;
        --bg: #ffffff;
        --accent: #1f6feb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e9edf2;
          --muted: #9aa5b1;
          --line: #2a313a;
          --bg: #161a20;
        }
      }
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        font: 13px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 14px;
      }
      button {
        width: 100%;
        padding: 9px 12px;
        margin-bottom: 7px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.ghost {
        background: transparent;
        color: var(--ink);
        font-weight: 500;
      }
      #out {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--line);
        white-space: pre-wrap;
        font-size: 12px;
        color: var(--muted);
        max-height: 260px;
        overflow: auto;
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <h1>JD Mailer Autofill</h1>
    <button id="fill">Fill this form</button>
    <button id="inspect" class="ghost">What can you see on this page?</button>
    <div id="out">Nothing filled yet. Nothing is ever submitted for you.</div>
    <script src="popup.js"></script>
  </body>
</html>
